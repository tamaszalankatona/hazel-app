<div class="relative h-12 w-full overflow-hidden rounded-xl border border-[#e4e1dd]">
  @if (variant === ThemePreviewVariant.Light) {
    <div class="flex h-full items-center justify-between bg-white px-5">
      <div class="flex items-center justify-start gap-1.5">
        <div class="m-0 size-5 rounded-full bg-[#f4d4ec]"></div>
        <div class="h-2 w-18 rounded-full bg-[#dededc]"></div>
      </div>
      <div class="h-2 w-9 rounded-full bg-[#20201f]"></div>
    </div>
  }

  @if (variant === ThemePreviewVariant.Dark) {
    <div class="flex h-full items-center justify-between bg-[#1c211f] px-5">
      <div class="flex items-center justify-start gap-1.5">
        <div class="m-0 size-5 rounded-full bg-[#694963]"></div>
        <div class="h-2 w-18 rounded-full bg-[#4b4d49]"></div>
      </div>
      <div class="h-2 w-9 rounded-full bg-[#e7e7e4]"></div>
    </div>
  }

  @if (variant === ThemePreviewVariant.System) {
    <div class="flex h-full">
      <div class="flex flex-1 items-center justify-center bg-white">
        <div class="size-5 rounded-full bg-[#f4d4ec]"></div>
      </div>

      <div class="flex flex-1 items-center justify-center bg-[#1c211f]">
        <div class="size-5 rounded-full bg-[#694963]"></div>
      </div>
    </div>
  }
</div>
