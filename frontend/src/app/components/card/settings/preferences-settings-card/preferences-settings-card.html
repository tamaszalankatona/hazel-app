<app-card-component>
  <app-card-header
    headingText="Appearance"
    descriptionText="Dispaly aesthetics, readability and visual comfort"
    header
  />
  <hlm-radio-group content [(ngModel)]="theme" class="flex w-full flex-col gap-4 xl:flex-row">
    @for (theme of AppearanceThemes; track theme.title) {
      <app-appearance-card
        [title]="theme.title"
        [description]="theme.description"
        [variant]="theme.variant"
        [icon]="theme.icon"
      />
    }
  </hlm-radio-group>
</app-card-component>
