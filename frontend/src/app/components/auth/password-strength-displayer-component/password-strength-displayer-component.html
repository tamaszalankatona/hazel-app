<div class="flex w-full items-center justify-between gap-x-2">
  @for (segment of segments; track segment) {
    <div
      class="h-[5px] flex-1 rounded"
      [class.bg-success]="score >= segment"
      [class.bg-surface-muted]="score < segment"
    ></div>
  }
  <p class="ml-2 text-xs font-light">{{ label }}</p>
</div>
