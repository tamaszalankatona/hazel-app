<ng-container>
  <header
    class="flex flex-col items-start justify-start space-y-4 md:flex-row md:items-center md:justify-between"
  >
    <div>
      <h1 class="text-3xl font-semibold">Settings</h1>
      <p class="text-sm font-light">
        Manage your personal credentials, household domain, and system preferences.
      </p>
    </div>
    <div class="flex gap-x-2">
      <button hlmBtn variant="outline" type="button" size="lg">Cancel</button>
      <button hlmBtn type="button" size="lg">Save changes</button>
    </div>
  </header>
  <main class="space-x-4">
    <app-account-settings-card />
    <app-preferences-settings-card />
    <app-notifications-settings-card />
    <app-danger-zone-settings-card />
  </main>
</ng-container>
